services:
  redis:
    image: redis:7-alpine
    ports:
      # Avoid colliding with a local Redis bound to 6379.
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: listen
      POSTGRES_PASSWORD: listen
      POSTGRES_DB: listen
    ports:
      # Host port avoids collisions with a local PostgreSQL install bound to 5432.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listen -d listen"]
      interval: 5s
      timeout: 5s
      retries: 5
