#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - ufw
  - fail2ban

write_files:
  - path: /etc/ssh/sshd_config.d/716fm.conf
    permissions: "0644"
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
  - path: /root/716fm-next-steps.txt
    permissions: "0644"
    content: |
      716FM pilot host bootstrap complete.

      Repo target:
        /opt/716fm

      Expected deployment flow:
        1. Put the repo contents under /opt/716fm
        2. Create /opt/716fm/deploy/digitalocean/pilot.env from pilot.env.example
        3. Run migrations:
           docker compose --env-file deploy/digitalocean/pilot.env -f deploy/digitalocean/docker-compose.pilot.yml --profile ops run --rm migrate
        4. Start services:
           docker compose --env-file deploy/digitalocean/pilot.env -f deploy/digitalocean/docker-compose.pilot.yml up -d --build web worker realtime caddy

runcmd:
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - mkdir -p /opt/716fm
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl restart ssh
